<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Performance Monitor</title>
    <!--
      GitHub Pages serves this file for any unknown path (e.g. a hard reload
      on a client-side route like /performance-monitor/athletes). Since this
      is a single-page app, we redirect back to index.html and encode the
      original path/query/hash in the query string. The matching script in
      index.html then restores the original URL via history.replaceState so
      react-router can pick up the correct route.
      See: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      // Number of path segments that make up the base path (repo name),
      // e.g. "/performance-monitor" -> 1
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
